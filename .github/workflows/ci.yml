name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Sync runtime + dev dependencies
        run: uv sync --frozen --extra rag --extra ui

      - name: Lint
        run: uv run ruff check .

      - name: Test (lean, offline)
        env:
          SUTRA_LEAN_TESTS: "1"
        run: uv run pytest -q
