[project]
name = "sutra"
version = "0.1.0"
description = "Sutra: A lightweight local-first RAG runtime and utilities."
requires-python = ">=3.10.12"
dependencies = [
  "pydantic",
  "requests",
  "tomli; python_version < '3.11'",
  "pymupdf",
  # Required by `sutra llama download` (huggingface_hub.hf_hub_download) to fetch
  # the GGUF on a clean runtime; previously relied on Colab's ambient install.
  "huggingface_hub>=0.23",
]

# Install:
#   Local XPU:  uv sync --extra xpu --extra rag --extra ui
#   Colab CUDA: uv sync --extra cuda --extra rag --extra ui
[project.optional-dependencies]
xpu = [
  "torch==2.9.1",
  "pytorch-triton-xpu==3.5.0",
  "llama-cpp-python[server]>=0.3.28",
]
cuda = [
  "torch>=2.5.1",
  "llama-cpp-python[server]>=0.3.28",
]
rag = [
  "kiwipiepy>=0.23.1",
  "bm25s>=0.3.9",
  # Bounded so a --system install does not clobber Colab's preinstalled numpy
  # (ABI break risk); the range covers Colab's 2.0.x and the locked 2.2.x.
  "numpy>=1.26,<2.3",
]
# torch-dependent embedding backend, opt-in only: the grading environment
# pins torch==2.5.1 and the default install path must not touch it.
embeddings = [
  "sentence-transformers>=2.7.0",
]
ui = [
  "chainlit>=1.1.302",
]

[project.scripts]
sutra = "sutra.cli:main"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "jupyter",
  "ipykernel",
  "jedi<0.20",
  "beautifulsoup4",
  "lxml",
  "tqdm",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sutra*"]

[tool.setuptools.package-data]
sutra = ["resources/ui/*", "resources/ui/public/*"]

[tool.uv]
conflicts = [
  [
    { extra = "xpu" },
    { extra = "cuda" },
  ],
]

[tool.uv.sources]
llama-cpp-python = [
  { index = "llama-cpp-vulkan", extra = "xpu" },
  { index = "llama-cpp-cu121", extra = "cuda" },
]
torch = [
  { index = "pytorch-xpu", extra = "xpu" },
  { index = "pytorch-cu121", extra = "cuda" },
]
pytorch-triton-xpu = { index = "pytorch-xpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-vulkan"
url = "https://abetlen.github.io/llama-cpp-python/whl/vulkan"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-cu121"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu121"
explicit = true

[tool.pytest.ini_options]
markers = [
    "integration: mark test as an integration test.",
]
