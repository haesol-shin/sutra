[project]
name = "nlp-term"
version = "0.1.0"
description = "Sutra: A lightweight local-first RAG runtime and utilities."
requires-python = ">=3.10.12"
dependencies = [
  "pydantic",
  "requests",
  "tomli; python_version < '3.11'",
  "pymupdf",
]

# Install:
#   Local XPU:  uv sync --extra xpu --extra rag --extra ui --extra legacy --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/vulkan
#   Colab CUDA: uv sync --extra cuda --extra rag --extra ui --extra legacy --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu121
#   Note: --extra-index-url is per-environment and cannot be baked into pyproject.toml (Vulkan vs CUDA conflict).
[project.optional-dependencies]
xpu = [
  "torch==2.9.1",
  "pytorch-triton-xpu==3.5.0",
  "llama-cpp-python[server]>=0.3.28",
]
cuda = [
  "torch>=2.5.1",
  "llama-cpp-python[server]>=0.3.28",
]
rag = [
  "sentence-transformers>=2.7.0",
  "kiwipiepy>=0.23.1",
  "bm25s>=0.3.9",
  "numpy",
]
ui = [
  "chainlit>=1.1.302",
]
legacy = [
  "scikit-learn",
  "joblib",
]

[project.scripts]
sutra = "sutra.cli:main"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
  "jupyter",
  "ipykernel",
  "jedi<0.20",
  "beautifulsoup4",
  "lxml",
  "tqdm",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sutra*"]

[tool.setuptools.package-data]
sutra = ["resources/ui/*"]

[tool.uv.sources]
pytorch-triton-xpu = { index = "pytorch-xpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.pytest.ini_options]
markers = [
    "integration: mark test as an integration test.",
]
