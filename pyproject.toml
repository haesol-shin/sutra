[project]
name = "nlp-term"
version = "0.1.0"
description = "Campus ChatBot term project environment and utilities."
requires-python = ">=3.10.12,<3.11"
dependencies = [
  "beautifulsoup4",
  "gradio",
  "ipykernel",
  "jedi<0.20",
  "joblib",
  "jupyter",
  "lxml",
  "numpy",
  "pandas",
  "pydantic",
  "pymupdf",
  "olefile",
  "python-dateutil",
  "pyyaml",
  "requests",
  "scikit-learn",
  "tqdm",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
xpu = [
  "torch==2.9.1",
  "pytorch-triton-xpu==3.5.0",
]
llm = [
  "accelerate>=1.13.0",
  "transformers>=5.10.2",
]

[project.scripts]
sutra = "sutra.cli:main"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
pytorch-triton-xpu = { index = "pytorch-xpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
